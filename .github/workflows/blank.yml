name: NIFTY CSV Auto Updater V3

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

jobs:
  update-nifty-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # DOWNLOAD NIFTY 50
      # ==================================================
      - name: Download NIFTY 50
        run: |
          curl -L \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -A "Mozilla/5.0" \
            "https://nsearchives.nseindia.com/content/indices/ind_nifty50list.csv" \
            -o NIFTY_50_LIST.csv

      # ==================================================
      # DOWNLOAD NIFTY 100
      # ==================================================
      - name: Download NIFTY 100
        run: |
          curl -L \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -A "Mozilla/5.0" \
            "https://nsearchives.nseindia.com/content/indices/ind_nifty100list.csv" \
            -o NIFTY_100_LIST.csv

      # ==================================================
      # DOWNLOAD NIFTY 500
      # ==================================================
      - name: Download NIFTY 500
        run: |
          curl -L \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -A "Mozilla/5.0" \
            "https://nsearchives.nseindia.com/content/indices/ind_nifty500list.csv" \
            -o NIFTY_500_LIST.csv

      # ==================================================
      # DOWNLOAD MIDCAP 100
      # ==================================================
      - name: Download NIFTY Midcap 100
        run: |
          curl -L \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -A "Mozilla/5.0" \
            "https://nsearchives.nseindia.com/content/indices/ind_niftymidcap100list.csv" \
            -o NIFTY_MIDCAP_100_LIST.csv

      # ==================================================
      # DOWNLOAD SMALLCAP 100
      # ==================================================
      - name: Download NIFTY Smallcap 100
        run: |
          curl -L \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -A "Mozilla/5.0" \
            "https://nsearchives.nseindia.com/content/indices/ind_niftysmallcap100list.csv" \
            -o NIFTY_SMALLCAP_100_LIST.csv

      # ==================================================
      # BASIC FILE CHECK
      # ==================================================
      - name: Validate files exist
        shell: bash
        run: |
          set -e

          files=(
            "NIFTY_50_LIST.csv"
            "NIFTY_100_LIST.csv"
            "NIFTY_500_LIST.csv"
            "NIFTY_MIDCAP_100_LIST.csv"
            "NIFTY_SMALLCAP_100_LIST.csv"
          )

          for file in "${files[@]}"; do

            echo "--------------------------------------"
            echo "Checking: $file"

            if [ ! -s "$file" ]; then
              echo "ERROR: $file is empty or missing."
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "All 5 CSV files downloaded successfully."

      # ==================================================
      # EXACT SYMBOL VALIDATION
      # ==================================================
      - name: Validate CSV structure and stock counts
        shell: bash
        run: |
          set -e

          validate_csv() {

            FILE="$1"
            EXPECTED="$2"

            echo ""
            echo "=========================================="
            echo "VALIDATING: $FILE"
            echo "EXPECTED STOCKS: $EXPECTED"
            echo "=========================================="

            python3 - "$FILE" "$EXPECTED" <<'PY'

          import csv
          import sys
          from collections import Counter

          file = sys.argv[1]
          expected = int(sys.argv[2])

          # ------------------------------------------
          # READ CSV
          # ------------------------------------------

          with open(
              file,
              newline="",
              encoding="utf-8-sig"
          ) as f:

              reader = csv.reader(f)

              rows = list(reader)

          if not rows:
              print("ERROR: CSV is empty.")
              sys.exit(1)

          # ------------------------------------------
          # HEADER
          # ------------------------------------------

          header = [
              str(x).strip().upper()
              for x in rows[0]
          ]

          print("HEADER:")
          print(" | ".join(header))

          if "SYMBOL" not in header:
              print("")
              print("ERROR: SYMBOL column not found.")
              sys.exit(1)

          symbol_col = header.index("SYMBOL")

          # ------------------------------------------
          # DATA
          # ------------------------------------------

          data_rows = rows[1:]

          print("")
          print("DATA ROWS:", len(data_rows))

          # ------------------------------------------
          # EXACT COUNT
          # ------------------------------------------

          if len(data_rows) != expected:

              print("")
              print("❌ WRONG STOCK COUNT")
              print("EXPECTED:", expected)
              print("FOUND:", len(data_rows))
              print("")
              print("CSV COMMIT BLOCKED.")

              sys.exit(1)

          # ------------------------------------------
          # SYMBOLS
          # ------------------------------------------

          symbols = []

          for row_number, row in enumerate(
              data_rows,
              start=2
          ):

              if len(row) <= symbol_col:

                  print(
                      f"ERROR: Row {row_number} "
                      "has no SYMBOL column."
                  )

                  sys.exit(1)

              symbol = (
                  str(row[symbol_col])
                  .strip()
                  .upper()
              )

              if not symbol:

                  print(
                      f"ERROR: Blank SYMBOL "
                      f"at row {row_number}."
                  )

                  sys.exit(1)

              symbols.append(symbol)

          # ------------------------------------------
          # DUPLICATES
          # ------------------------------------------

          counts = Counter(symbols)

          duplicates = sorted(
              symbol
              for symbol, count in counts.items()
              if count > 1
          )

          if duplicates:

              print("")
              print("❌ DUPLICATE SYMBOLS FOUND:")

              for symbol in duplicates:
                  print(symbol)

              print("")
              print("CSV COMMIT BLOCKED.")

              sys.exit(1)

          # ------------------------------------------
          # UNIQUE COUNT
          # ------------------------------------------

          unique_count = len(set(symbols))

          print("STOCK COUNT:", len(symbols))
          print("UNIQUE SYMBOLS:", unique_count)
          print("DUPLICATES:", len(duplicates))

          if unique_count != expected:

              print("")
              print("❌ UNIQUE SYMBOL COUNT ERROR")
              print("EXPECTED:", expected)
              print("FOUND:", unique_count)

              sys.exit(1)

          print("")
          print("✅ SYMBOL VALIDATION PASSED")

          PY
          }

          # ------------------------------------------
          # EXPECTED COUNTS
          # ------------------------------------------

          validate_csv "NIFTY_50_LIST.csv" 50
          validate_csv "NIFTY_100_LIST.csv" 100
          validate_csv "NIFTY_500_LIST.csv" 500
          validate_csv "NIFTY_MIDCAP_100_LIST.csv" 100
          validate_csv "NIFTY_SMALLCAP_100_LIST.csv" 100

          echo ""
          echo "=========================================="
          echo "✅ ALL CSV VALIDATIONS PASSED"
          echo "=========================================="

      # ==================================================
      # FINAL REPORT
      # ==================================================
      - name: Final row count report
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "FINAL NIFTY CSV COUNTS"
          echo "=========================================="

          python3 <<'PY'

          import csv

          files = [
              "NIFTY_50_LIST.csv",
              "NIFTY_100_LIST.csv",
              "NIFTY_500_LIST.csv",
              "NIFTY_MIDCAP_100_LIST.csv",
              "NIFTY_SMALLCAP_100_LIST.csv"
          ]

          for file in files:

              with open(
                  file,
                  newline="",
                  encoding="utf-8-sig"
              ) as f:

                  rows = list(csv.reader(f))

              print(
                  f"{file}: "
                  f"{len(rows) - 1} stocks"
              )

          PY

      # ==================================================
      # COMMIT
      # ==================================================
      - name: Commit updated CSV files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            NIFTY_50_LIST.csv \
            NIFTY_100_LIST.csv \
            NIFTY_500_LIST.csv \
            NIFTY_MIDCAP_100_LIST.csv \
            NIFTY_SMALLCAP_100_LIST.csv

          if git diff --cached --quiet; then

            echo "No CSV changes detected."
            echo "Nothing to commit."

          else

            git commit \
              -m "Update NIFTY CSV files"

            git push

            echo ""
            echo "✅ CSV files committed successfully."

          fi
